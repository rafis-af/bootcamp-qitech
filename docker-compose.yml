# O docker compose sobe a aplicacao e o banco juntos, com um comando so:
#
#     docker compose up
#
# Os testes rodam dentro do Docker, contra a API que subiu aqui:
#
#     docker compose --profile tests run --build --rm tests
#
# (o servico "tests", mais abaixo, tem o detalhe)
#
# Nao precisa criar arquivo nenhum antes: cada configuracao abaixo tem um
# valor padrao, escrito no proprio ${VARIAVEL:-padrao}. Le-se assim:
# "use o que estiver na variavel VARIAVEL; se ela nao existir, use padrao".
#
# O .env continua valendo, e agora e OPCIONAL: se voce criar um (copiando
# o .env.example), o compose le esse arquivo e o que estiver la ganha do
# padrao. E o jeito de trocar uma porta ocupada ou o token, sem editar
# este arquivo.

services:
  api:
    build:
      context: .
      target: api
    ports:
      # Se a porta 3000 ja estiver ocupada na sua maquina, coloque
      # API_PORT=3001 (ou outra livre) no seu .env.
      - "${API_PORT:-3000}:3000"
    environment:
      # Dentro do compose, o banco atende pelo nome "db" — nao por localhost.
      # Por isso esta linha nao tem padrao pra sobrescrever: aqui dentro o
      # endereco do banco e sempre este.
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
      APP_ENV: ${APP_ENV:-local}
      SERVICE_NAME: ${SERVICE_NAME:-bootcamp-api}
      # A senha que protege os endpoints internos. O padrao vale pra
      # estudar; num sistema de verdade, isso nunca teria valor padrao.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      # Receita e Serasa (RFC 5.1). Aqui dentro quem responde pelas duas
      # e o container "mock", logo abaixo. Variavel que nao esta nesta
      # lista NAO CHEGA no container: o compose repassa o que esta
      # escrito aqui, e mais nada.
      RECEITA_API_URL: ${RECEITA_API_URL:-http://mock:8080/receita}
      RECEITA_API_INTERNAL_TOKEN: ${RECEITA_API_INTERNAL_TOKEN:-default_token}
      RECEITA_API_TIMEOUT: ${RECEITA_API_TIMEOUT:-5}
      SERASA_API_URL: ${SERASA_API_URL:-http://mock:8080/serasa}
      SERASA_API_INTERNAL_TOKEN: ${SERASA_API_INTERNAL_TOKEN:-default_token}
      SERASA_API_TIMEOUT: ${SERASA_API_TIMEOUT:-5}
    volumes:
      # Monta o codigo pra dentro do container: salvou o arquivo,
      # a API recarrega sozinha (o --reload ali embaixo).
      - ./src:/app
      # Os testes tambem montados aqui, para "docker compose exec api python -m pytest"
      # achar a suite. So existe no ambiente de desenvolvimento; a imagem nao muda.
      - ./tests:/app/tests
    # --reload: salvou o arquivo, a API reinicia sozinha.
    command: uvicorn app:app --host 0.0.0.0 --port 3000 --no-server-header --reload
    healthcheck:
      # "Subiu" nao e a mesma coisa que "ja responde". E esta checagem
      # que diz quando a API passa a atender de verdade — espere ela
      # ficar (healthy) antes de rodar o pytest, ou o primeiro teste
      # bate numa porta que ainda nao responde.
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      mock:
        condition: service_healthy

  # O mock da Receita e da Serasa (mocks/app.py). Nao publica porta na sua
  # maquina: so a API fala com ele, pela rede interna do compose.
  mock:
    build: ./mocks/.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/health_check\")'"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 5s

  db:
    build: ./database/.
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp
      POSTGRES_DB: bootcamp
    ports:
      # Mesma ideia: DB_PORT=5433 no .env se a 5432 estiver ocupada.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # A API so sobe depois que o banco responder de verdade.
      test: ["CMD-SHELL", "pg_isready -U bootcamp -d bootcamp"]
      interval: 3s
      timeout: 3s
      retries: 20


  # Os testes, dentro do compose. Ficam atras do perfil "tests", entao o
  # "docker compose up" comum NAO os sobe. Para rodar a suite inteira:
  #
  #     docker compose run --rm tests
  #
  # Ele espera a API ficar (healthy) e depois roda o pytest contra ela,
  # pela rede interna do compose — o mesmo caminho que a API usa com o db.
  tests:
    build:
      context: .
      target: tests
    profiles: ["tests"]
    environment:
      APP_ENV: test
      SERVER_LOCALHOST: api
      API_PORT: 3000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-default_token}
      DATABASE_URL: postgresql+psycopg2://bootcamp:bootcamp@db:5432/bootcamp
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
